[package]
name = "ailyn-gomez-dev/its-fashion"
version = "0.1.4"
description = "Its Fashion Laravel Application"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/.env" = ".env"
"/app/app" = "app"
"/app/bootstrap" = "bootstrap"
"/app/config" = "config"
"/app/database" = "database"
"/app/public" = "public"
"/app/resources" = "resources"
"/app/routes" = "routes"
"/app/storage" = "storage"
"/app/vendor" = "vendor"
"/app/artisan" = "artisan"
"/app/composer.json" = "composer.json"
"/app/public/storage" = "storage/app/public"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
