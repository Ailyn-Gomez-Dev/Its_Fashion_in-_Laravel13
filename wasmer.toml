[package]
name = "ailyn-gomez-dev/its-fashion"
version = "0.1.0"
description = "Its Fashion Laravel Application"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."
"/app/public/storage" = "storage/app/public"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
